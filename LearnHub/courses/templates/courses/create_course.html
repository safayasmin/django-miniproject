<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create course</title>
</head>
<body>
    <h2>
        Create a New Course
    </h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Course</button>
    </form>
    
</body>
</html>
